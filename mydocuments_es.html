<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Documentos - Corzo Notary</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .docs-container { max-width: 700px; margin: 40px auto; padding: 30px; }
    .docs-form { display: flex; flex-direction: column; gap: 18px; margin-top: 24px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-weight: 600; font-size: 14px; }
    .form-group input {
      padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px;
    }
    .view-btn {
      padding: 14px; background: #2563eb; color: #fff; border: none;
      border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .view-btn:hover { background: #1d4ed8; }
    .view-btn:disabled { background: #999; cursor: not-allowed; }
    .message { padding: 12px 16px; border-radius: 6px; font-size: 14px; }
    .message.success { background: #d1fae5; color: #065f46; }
    .message.error { background: #fee2e2; color: #991b1b; }
    .message.info { background: #dbeafe; color: #1e40af; }
    .file-table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    .file-table th { text-align: left; padding: 10px 12px; border-bottom: 2px solid #e5e7eb; font-size: 13px; color: #666; }
    .file-table td { padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    .file-table tr:hover { background: #f9fafb; }
    .file-link { color: #2563eb; text-decoration: none; font-weight: 500; }
    .file-link:hover { text-decoration: underline; }
    .back-link { text-align: center; margin-top: 24px; }
    .back-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }
    .file-icon { font-size: 20px; }
    #documentsSection { display: none; }
  </style>
</head>
<body>
  <div class="docs-container">
    <div style="text-align:center; margin-bottom: 20px;">
      <img src="/notary_logo.svg" alt="Corzo Notary" style="max-height: 80px;">
    </div>
    <h2 style="text-align:center;">Mis Documentos</h2>
    <p style="text-align:center; color:#666; font-size:14px;">Ingrese su correo electrónico y contraseña de acceso para ver sus documentos subidos.</p>

    <div id="message"></div>

    <form class="docs-form" id="docsForm">
      <div class="form-group">
        <label for="email">Su Correo Electrónico</label>
        <input type="email" id="email" name="email" required placeholder="Ingrese el correo que usó para subir">
      </div>

      <div class="form-group">
        <label for="password">Contraseña de Acceso</label>
        <input type="password" id="password" name="password" required placeholder="Ingrese la contraseña proporcionada">
      </div>

      <button type="submit" class="view-btn" id="viewBtn">Ver Mis Documentos</button>
    </form>

    <div id="documentsSection">
      <h3 style="margin-top: 30px;">Sus Documentos Subidos</h3>
      <table class="file-table" id="fileTable">
        <thead>
          <tr>
            <th>Nombre del Archivo</th>
            <th>Tamaño</th>
            <th>Subido</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="fileTableBody"></tbody>
      </table>
    </div>

    <div class="back-link">
      <a href="/secureupload2_es.html">&larr; Volver a Subir</a>
    </div>
  </div>

  <script>
    const API_URL = 'https://api.notaryservices.work';

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.innerHTML = text ? '<div class="message ' + type + '">' + text + '</div>' : '';
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('es-ES', { year: 'numeric', month: 'short', day: 'numeric' }) +
        ' ' + d.toLocaleTimeString('es-ES', { hour: 'numeric', minute: '2-digit' });
    }

    function getFileIcon(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (['pdf'].includes(ext)) return '📄';
      if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg'].includes(ext)) return '🖼️';
      if (['doc', 'docx'].includes(ext)) return '📝';
      if (['xls', 'xlsx'].includes(ext)) return '📊';
      if (['zip', 'rar', '7z'].includes(ext)) return '🗜️';
      return '📎';
    }

    document.getElementById('docsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('viewBtn');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Cargando...';
      showMessage('', '');

      try {
        const res = await fetch(API_URL + '/list?email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password));
        const data = await res.json();

        if (!res.ok) {
          showMessage(data.error || 'Error al cargar los documentos.', 'error');
          document.getElementById('documentsSection').style.display = 'none';
          return;
        }

        const tbody = document.getElementById('fileTableBody');

        if (data.files.length === 0) {
          showMessage('No se encontraron documentos para este correo. Asegúrese de haber usado el mismo correo al subir.', 'info');
          document.getElementById('documentsSection').style.display = 'none';
          return;
        }

        tbody.innerHTML = data.files.map(f => {
          const downloadUrl = API_URL + '/download?key=' + encodeURIComponent(f.key) +
            '&email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password);
          return '<tr>' +
            '<td><span class="file-icon">' + getFileIcon(f.name) + '</span> ' + f.name + '</td>' +
            '<td>' + formatSize(f.size) + '</td>' +
            '<td>' + formatDate(f.uploaded) + '</td>' +
            '<td><a class="file-link" href="' + downloadUrl + '" target="_blank">Ver</a></td>' +
            '</tr>';
        }).join('');

        document.getElementById('documentsSection').style.display = 'block';
        showMessage('', '');
      } catch (err) {
        showMessage('Error al cargar los documentos: ' + err.message, 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Ver Mis Documentos';
    });
  </script>
</body>
</html>
